name: stampy

services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        volumes:
            - .:/var/www/html
            - vendor:/var/www/html/vendor
        environment:
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: stampy
            DB_USERNAME: attendance
            DB_PASSWORD: secret
        depends_on:
            mysql:
                condition: service_healthy

    nginx:
        image: nginx:alpine
        ports:
            - "8000:80"
        volumes:
            - .:/var/www/html:ro
            - ./docker/nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app

    vite:
        image: node:22-alpine
        working_dir: /var/www/html
        command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
        environment:
            VITE_HMR_CLIENT_PORT: 5174
        volumes:
            - .:/var/www/html
            - node_modules:/var/www/html/node_modules
        ports:
            - "5174:5173"

    mysql:
        image: mysql:9.4
        environment:
            MYSQL_DATABASE: stampy
            MYSQL_USER: attendance
            MYSQL_PASSWORD: secret
            MYSQL_ROOT_PASSWORD: secret
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psecret"]
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    vendor:
    node_modules:
    mysql_data:
